[project]
name = "bookverse"
version = "0.1.0"
description = "Universal Book Intelligence Platform"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "BookVerse Authors"}]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "redis>=5.0.1",
    "celery[redis]>=5.3.6",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "respx>=0.20.2",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "alembic-autogen>=0.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
