name: bookverse
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bookverse
      POSTGRES_PASSWORD: bookverse
      POSTGRES_DB: bookverse
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookverse -d bookverse"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["opensearch:/usr/share/opensearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -q green"]
      interval: 10s
      timeout: 10s
      retries: 30

  minio:
    image: minio/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: bookverse
      MINIO_ROOT_PASSWORD: bookverse
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redis:
  opensearch:
  minio:
